<style>
:root{--bg:#0b0b14;--fg:#f4f4fb;--hint:#9a9ab0;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.10);--acc:#8b5cf6;--acc2:#ec4899;--acc3:#06b6d4;--ok:#22c55e;--glass:rgba(20,20,35,.55)}
.light{--bg:#f6f5fb;--fg:#15132a;--hint:#6b6880;--card:rgba(255,255,255,.75);--line:rgba(20,10,60,.10);--glass:rgba(255,255,255,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Heebo,Inter,system-ui,sans-serif;min-height:100%}
[lang=en] body{font-family:Inter,Heebo,system-ui,sans-serif}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 15% 10%,#8b5cf655,transparent 70%),radial-gradient(35% 30% at 90% 20%,#ec489944,transparent 70%),radial-gradient(40% 30% at 50% 100%,#06b6d433,transparent 70%);animation:float 18s ease-in-out infinite alternate}
@keyframes float{to{transform:translate3d(3%,-3%,0) rotate(6deg)}}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 110px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:20px;box-shadow:0 6px 20px #8b5cf655}
.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}.top p{margin:0;color:var(--hint);font-size:12.5px}
.gnc{position:relative;overflow:hidden;border-radius:20px;padding:16px;border:1px solid var(--line);cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.gnc.r{background:linear-gradient(135deg,#ff5f9e,#b44cff 60%,#6a5cff)}.gnc.b{background:linear-gradient(135deg,#ff7a18,#d7263d 55%,#3a0d2e)}
.gnc b{color:#fff;font-size:17px}.gnc small{color:rgba(255,255,255,.88);font-size:12px;line-height:1.35}.gnc .ge{font-size:34px;position:absolute;top:10px;inset-inline-end:12px}
.gnc .price{position:absolute;top:12px;inset-inline-start:12px;background:rgba(0,0,0,.28);color:#fff}.gnc .nw{font-size:10px;font-weight:800;background:#fff;color:#b44cff;border-radius:6px;padding:1px 6px;margin-inline-start:6px}
.gnp{margin-top:12px;padding:16px}.gnp h3{margin:12px 0 6px;font-size:13px;color:var(--hint)}.gnp .chips{display:flex;flex-wrap:wrap;gap:6px}
.gnp textarea{width:100%;min-height:60px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;cursor:pointer;backdrop-filter:blur(12px)}
.chip.sel{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.sp{flex:1}
.glass{background:var(--card);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hero{padding:16px;margin:6px 0 14px;background:linear-gradient(135deg,#8b5cf633,#ec489922);position:relative;overflow:hidden}
.hero b{font-size:15px}.hero small{display:block;color:var(--hint);margin-top:3px}
.hero .bal{position:absolute;inset-inline-end:14px;top:14px;font-weight:800}
h2{font-size:16px;margin:18px 2px 10px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:grid;gap:10px}
.card{padding:13px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);cursor:pointer;position:relative;transition:transform .15s,border-color .2s,box-shadow .2s;backdrop-filter:blur(14px);animation:in .35s both}
.card:active{transform:scale(.97)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 3px #8b5cf640,0 10px 30px #8b5cf630}
.card b{display:block;font-size:14.5px}.card small{color:var(--hint);font-size:12px;display:block;margin-top:3px;line-height:1.35}
.row{display:flex;align-items:center;gap:12px}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;background:linear-gradient(135deg,#8b5cf640,#ec489930)}
.price{position:absolute;inset-inline-end:10px;top:10px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#0006;color:#fff}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;margin-inline-start:6px}
.thumb{height:92px;border-radius:12px;margin:-3px -3px 9px;background:#0003 center/cover}
.thumb.cov{position:relative;overflow:hidden}.thumb.cov:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#0008)}.card .price{z-index:2}
.meter{display:inline-flex;gap:2px;vertical-align:middle;margin:0 3px}.meter span{width:9px;height:5px;border-radius:3px;background:var(--line)}.meter span.on{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.sum .t{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:14px}.sum .t span{color:var(--hint)}
.sum .total{font-size:18px;font-weight:800;border:0}.sum .total span{color:var(--fg)}
s{color:var(--hint);font-weight:400;font-size:14px;margin-inline-end:6px}
.steps{display:flex;gap:6px;margin:4px 0 6px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line);transition:.3s}.steps i.on{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.hide{display:none!important}
.fade{animation:in .35s both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:800;font-size:15.5px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 30px #8b5cf650;cursor:pointer;margin-top:14px}
.btn.ghost{background:var(--card);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none}.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:linear-gradient(135deg,var(--acc),var(--acc2))}.sw.on:after{inset-inline-start:21px}
.terms{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--hint);margin-top:12px}.terms input{width:20px;height:20px;accent-color:var(--acc)}
a{color:var(--acc)}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);z-index:10}
.tabs button{flex:1;background:none;border:0;color:var(--hint);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer;transition:color .2s}
.tabs button i{font-style:normal;font-size:21px;transition:transform .2s}.tabs button.on{color:var(--fg)}.tabs button.on i{transform:translateY(-2px) scale(1.12)}
.tabs button.on:after{content:"";width:18px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gi{border-radius:18px;overflow:hidden;position:relative;aspect-ratio:3/4;background:var(--card);border:1px solid var(--line);cursor:pointer;animation:in .4s both}
.gi video,.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi .cap{position:absolute;bottom:0;left:0;right:0;padding:24px 10px 9px;background:linear-gradient(transparent,#000c);color:#fff;font-size:12.5px;font-weight:700}
.gi .cap small{display:block;font-weight:500;opacity:.8;font-size:11px}
.sk{background:linear-gradient(90deg,var(--card) 25%,rgba(255,255,255,.14) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.link{font-family:Inter,monospace;font-size:12.5px;padding:12px;border-radius:14px;background:#0003;word-break:break-all;direction:ltr;text-align:left;margin-top:10px}
.big{font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.onb{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.onb .slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.onb .slides::-webkit-scrollbar{display:none}
.onb .sl{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.onb .em{font-size:76px;width:150px;height:150px;border-radius:40px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf655,#ec489944);box-shadow:0 20px 60px #8b5cf640;margin-bottom:28px;animation:pop .6s both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.onb h3{font-size:24px;margin:0 0 10px;font-weight:800}.onb p{color:var(--hint);margin:0;font-size:15px;line-height:1.5;max-width:320px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px}.dots i{width:7px;height:7px;border-radius:9px;background:var(--line);transition:.3s}.dots i.on{width:22px;background:var(--acc)}
.onb .ctl{padding:16px 22px calc(22px + env(safe-area-inset-bottom))}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;animation:in .3s}
.note{font-size:11.5px;color:var(--hint);text-align:center;margin-top:10px}
.inp{width:100%;box-sizing:border-box;margin-top:8px;padding:10px 12px;border-radius:12px;border:1px solid rgba(127,127,127,.35);background:transparent;color:inherit;font:inherit;font-size:14px}
.salebar{position:sticky;top:0;z-index:98;text-align:center;font-weight:800;font-size:13px;padding:7px;background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff;border-radius:0 0 12px 12px}
</style>
</head>

  go(['cs',Q.g,Q.s,Q.l,Q.sub&&(LG=='he'?'he':LG)!=Q.l?(LG=='he'?'he':LG):'none',Q.e,Q.r.join('.')].join('-'))};
}

 if(c.dataset.sl)Q.l=c.dataset.sl;else if(c.dataset.se)Q.e=c.dataset.se;else{const[k,v]=c.dataset.sq.split(':');if(k=='r'){const i=Q.r.indexOf(v);if(i>=0){if(Q.r.length>2)Q.r.splice(i,1)}else if(Q.r.length<4)Q.r.push(v)}else Q[k]=v}draw()});
window.drawSeries=draw;draw();
})();
